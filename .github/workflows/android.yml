name: Build ZENITH Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje yapisini kur
        run: |
          mkdir -p app/src/main/java/com/zenith/mobile app/src/main/assets
          cp MainActivity.kt app/src/main/java/com/zenith/mobile/MainActivity.kt
          cp index.html app/src/main/assets/index.html
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app-build.gradle app/build.gradle

      - name: Ikon ekle
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/values app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF2'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00E5FF"
                  android:pathData="M34,30 L82,30 L82,41 L56,57 L76,57 L32,80 L46,62 L28,62 L56,43 L34,43 Z" />
          </vector>
          EOF2
          cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF2'
          <resources>
              <color name="ic_launcher_background">#0A0E1A</color>
          </resources>
          EOF2
          for n in ic_launcher ic_launcher_round; do
          cat > app/src/main/res/mipmap-anydpi-v26/$n.xml <<'EOF2'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF2
          done
          sed -i 's#@android:drawable/sym_def_app_icon#@mipmap/ic_launcher#' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK hazirla
        run: cp app/build/outputs/apk/debug/app-debug.apk ZenithMobile.apk

      - name: Release yayinla
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: ZENITH Android
          artifacts: ZenithMobile.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
